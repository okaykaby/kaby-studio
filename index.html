.mpa .t,.mc{height:100%;overflow-y:auto;padding:6.7vw 5.3vw 14vw;opacity:0;transition:opacity .2s}
body[data-view=about] .mpa .t{opacity:1;transition:opacity .4s 1.1s}
.mc{position:absolute;inset:0;z-index:3;pointer-events:none}
body[data-view=contact] .mc{opacity:1;pointer-events:auto;transition:opacity .4s .4s}
.mob br{display:none}
.mob h2{font:700 clamp(24px,5.4vw,56px)/1 var(--f)}

.mx{right:2.5vw;bottom:2.5vw;width:3.4vw;min-width:22px;z-index:5;opacity:0;pointer-events:none;transition:opacity .3s}
body[data-view=about] .mband>.mx,body[data-view=contact] .mband>.mx{opacity:1;pointer-events:auto;transition:opacity .4s .9s}
.mband>.mx{position:absolute}
.mtiles{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:var(--T);margin:var(--mbar) 0}
.mt{position:relative;border:0;padding:0;background:#000;overflow:hidden;cursor:pointer}
.mt video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mt.y{display:grid;place-items:center;padding:0 6%;background:#f3eb15;color:#000;text-align:center;text-wrap:balance;text-transform:uppercase;font:700 4.3vw/1.05 var(--f)}
.mp{position:absolute;z-index:6;left:0;right:0;bottom:var(--mbar);top:calc(var(--sq) + var(--mbar));background:var(--c);visibility:hidden;clip-path:inset(calc(var(--o,0px) + var(--r)*var(--T)) calc((1 - var(--k))*50vw) calc(100% - var(--o,0px) - (var(--r) + 1)*var(--T)) calc(var(--k)*50vw));transition:clip-path .7s var(--ease),background .3s,visibility 0s .7s}
.mp.y{top:0}
.mp.on{visibility:visible;clip-path:inset(0);background:#fff;transition:clip-path .7s var(--ease),background .3s .5s,visibility 0s}
.mp.y.on{background:var(--c)}
.mp .in{height:100%;overflow-y:auto;padding:11.5vw 18.8vw 12vw;opacity:0;transition:opacity .2s}
.mp.y .in{padding:6.7vw 5.3vw 14vw}
.mp.on .in{opacity:1;transition:opacity .4s .55s}
.mp>.mx{position:absolute;transition:opacity .2s}
.mp.on>.mx{opacity:1;pointer-events:auto;transition:opacity .4s .55s}
.mp video{display:block;width:100%;aspect-ratio:2072/1566;object-fit:cover;background:#000;margin-bottom:4vw}
}

<body data-view="home">

<button class="mab" data-go="about" aria-label="About">About<svg viewBox="0 0 121 40" aria-hidden="true"><path d="M0 20H92" stroke="#000" stroke-width="14"/><path d="M80 0 121 20 80 40z"/></svg></button>
<div class="mpa"><div class="t"></div></div><div class="mc"></div>
<button class="ctl mx" data-go="" aria-label="Close"><svg viewBox="0 0 40 40" fill="none" stroke="#000" stroke-width="9"><path d="M5 5 35 35M35 5 5 35"/></svg></button></section>

<script>
const C={m:'#bc52a0',w:'#fff',g:'#67bc46',k:'#000',y:'#f3eb15',b:'#3752a3',r:'#ed1d26'};
const blocks=document.querySelector('.blocks'),main=document.querySelector('.main'),strip=document.querySelector('.strip');
[...'mwggkkyykybbbwykbr'].forEach(c=>{const d=document.createElement('div');d.style.background=C[c];blocks.append(d)});
// id, title, video file, tag line, paragraphs, tile color, tile text color
const S=[
['portal','The Portal','chaseatlantic','Fan ecosystem / Web / Music',['Fan ecosystem built for Chase Atlantic, with Discord bot integration, XP rewards, release-based challenges, 3D components, and digital unlockables tied to vinyl drops. Led concept development and client partnership from initial pitch through a two-year build. 13,000+ signups at launch.'],C.g],
['tilam','Take It Like A Man','tilam','Art book / Photo edit / Print design',['An 80-page art book for Amanda Shires’ 2022 album, edited down from 300+ photographs spanning studio and location shoots, with full layout, cover, and print direction.'],C.k,'#fff'],
['horseback','Horseback','horseback','Game / Interactive / Brand partnership',['A side-scrolling browser game built around Jenna Paulette’s single, launched in tandem with her Justin Boots partnership and a live rodeo. Players rode for a chance to win a free pair of boots.','Creative direction from concept through launch.'],C.b],
['theater','The Theater','iceninekills','Web experience / 3D / Entertainment',['Full band website built as a navigable 3D theater, with a snack bar, ticket booth, custom coming-soon posters, and a screening room for new releases. Launched alongside their Terrifier&nbsp;3 partnership, with the latest visual redesign in collaboration with the motion picture release of Scream&nbsp;7.','Creative direction on the full digital experience.'],C.r],
['onerequest','OneRequest','onerequest','Brand campaign / Motion / Copy',['Full brand takeover for an online car buying platform: original animated ad, extended how-it-works spot, and photoshoot direction for the static campaign. Wrote the tagline, the sub-tagline, and the CTA. All three went everywhere.'],C.y]
];
S.forEach(([id,t,v,tag,ps,c,tc])=>{
  strip.insertAdjacentHTML('beforeend',`<button class="tile" data-go="${id}" style="--c:${c};--t:${tc||'#000'}" aria-label="${t}"><video src="assets/videos/${v}.mp4#t=0.001" preload="metadata" muted playsinline></video><span class="lab">${t}</span></button>`);
  main.insertAdjacentHTML('beforeend',`<section class="panel case" id="p-${id}"><video data-src="assets/videos/${v}.mp4" loop muted playsinline></video><div class="txt"><h2>${t}</h2><h3>${tag.replace(/\d+/g,"<span class=n>$&</span>")}</h3>${ps.map(p=>`<p>${p}</p>`).join('')}</div></section>`);
});
main.insertAdjacentHTML('beforeend',`<section class="panel pa" id="p-about"><div class="t"><h2>About</h2><h3>Bridging digital to physical</h3><p>Southern-raised NYC creative who came up making music and directing music videos, which gave me something most creative careers don’t start with: a real understanding of what the full arc of creative work actually feels like. That foundation never left.</p><p>I’ve spent years leading campaign direction for clients across entertainment, music, and digital media, building brand worlds and storytelling frameworks that had to work across channels, audiences, and stakeholders simultaneously. I specialize in protecting tone and continuity across complex creative environments, and I’m equally comfortable leading a concepting session, selling an idea to a skeptical client, or getting into the weeds with a team to make sure the execution lands the way the concept intended.</p></div></section>
<section class="panel" id="p-contact"><h2>Contact</h2><h3>Good work starts with good convo, right?</h3><p>Whether it’s something new, or something that already exists,<br>I’d love to chat about it.</p><a class="btn" href="mailto:kaby615@gmail.com">Email</a><a class="btn" href="KabyGilley-Resume-2026.pdf" target="_blank" rel="noopener">Resume</a></section>`);
const XS='<svg viewBox="0 0 40 40" fill="none" stroke="#000" stroke-width="9"><path d="M5 5 35 35M35 5 5 35"/></svg>';
const mlow=document.querySelector('.mlow'),mt=document.querySelector('.mtiles');
[...'mwggkkyykybbbwykbr'].forEach(c=>{const d=document.createElement('div');d.style.background=C[c];document.querySelector('.mblocks').append(d)});
document.querySelector('.mpa .t').innerHTML=document.querySelector('#p-about .t').innerHTML;
document.querySelector('.mc').innerHTML=document.getElementById('p-contact').innerHTML;
S.forEach(([id,t,v,,,c],i)=>{
  mt.insertAdjacentHTML('beforeend',`<button class="mt" data-go="${id}" aria-label="${t}"><video src="assets/videos/${v}.mp4#t=0.001" preload="metadata" muted playsinline></video></button>`);
  mlow.insertAdjacentHTML('beforeend',`<section class="mp" id="m-${id}" style="--k:${i%2};--r:${i>>1};--c:${id==='onerequest'?C.g:c}"><div class="in"><video data-src="assets/videos/${v}.mp4" loop muted playsinline></video>${document.querySelector('#p-'+id+' .txt').innerHTML}</div><button class="ctl mx" data-go="" aria-label="Close">${XS}</button></section>`);
});
mt.insertAdjacentHTML('beforeend','<button class="mt y" data-go="bridging">Bridging digital to physical</button>');
mlow.insertAdjacentHTML('beforeend',`<section class="mp y" id="m-bridging" style="--k:1;--r:2;--c:#f3eb15;--o:calc(var(--sq) + var(--mbar))"><div class="in">${document.querySelector('#p-about .t').innerHTML}</div><button class="ctl mx" data-go="" aria-label="Close">${XS}</button></section>`);
const ids=[...S.map(s=>s[0]),'about','contact','bridging'];
const MQ=matchMedia('(max-width:800px)'),COV=[...S.map(s=>s[0]),'bridging'];
function render(){
  let v=location.hash.slice(1);v=ids.includes(v)?v:'home';
  if(v==='bridging'&&!MQ.matches)v='about';
  document.body.dataset.view=v;
  document.querySelectorAll('.panel,.mp').forEach(p=>{
    const on=p.id.slice(2)===v;p.classList.toggle('on',on);
    const m=p.querySelector('video');
    if(m){if(on){if(!m.src)m.src=m.dataset.src;m.play().catch(()=>{})}else m.pause()}
  });
  document.querySelectorAll('.tile').forEach(t=>t.classList.toggle('on',t.dataset.go===v));
  if(v!=='home')scrollTo(0,0);
}
const warm=e=>{const b=e.target.closest('.tile,.mt');if(!b||!b.dataset.go)return;document.querySelectorAll((MQ.matches?'#m-':'#p-')+b.dataset.go+' video').forEach(m=>{if(!m.src){m.preload='auto';m.src=m.dataset.src}})};
['pointerover','touchstart','focusin'].forEach(t=>document.addEventListener(t,warm,{capture:true,passive:true}));
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)location.hash=b.dataset.go});
document.addEventListener('keydown',e=>{if(e.key==='Escape')location.hash=''});
addEventListener('hashchange',render);MQ.addEventListener('change',render);render();
</script>
